services:
  app:
    # Compose is the local development environment; production uses the default
    # INSTALL_DEV=0 image build without development dependencies.
    build:
      context: .
      args:
        INSTALL_DEV: "1"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
      APP_ENV: "${APP_ENV:-dev}"
      APP_SECRET: "${APP_SECRET:?Define APP_SECRET en .env.local}"
      DATABASE_URL: "${DATABASE_URL:?Define DATABASE_URL en .env.local}"
    depends_on:
      - db

  db:
    image: mariadb:10.4.34
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env.local}"
      MYSQL_USER: "${MYSQL_USER:?Define MYSQL_USER en .env.local}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env.local}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env.local}"
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  vendor_data:
